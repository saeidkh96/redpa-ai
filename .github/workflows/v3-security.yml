name: V3 Security Gate

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:
  security:
    name: RedPA v3 Security

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel


      # ------------------------------------------------------------
      # Runtime dependencies
      # ------------------------------------------------------------

      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements.txt


      # ------------------------------------------------------------
      # Test / security dependencies
      # ------------------------------------------------------------

      - name: Install test and security dependencies
        run: |
          python -m pip install pytest pytest-asyncio httpx pip-audit


      # ------------------------------------------------------------
      # Secret scanning
      # ------------------------------------------------------------

      - name: Secret scan
        run: |
          python scripts/security/secret_scan.py


      # ------------------------------------------------------------
      # Dependency vulnerabilities
      # ------------------------------------------------------------

      - name: Python dependency audit
        run: |
          python -m pip_audit -r requirements.txt


      # ------------------------------------------------------------
      # Compile
      # ------------------------------------------------------------

      - name: Compile backend
        run: |
          python -m compileall -q backend/app


      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------

      - name: Backend tests
        run: |
          python -m pytest tests -q


      # ------------------------------------------------------------
      # Production config security tests
      # ------------------------------------------------------------

      - name: Production security tests
        run: |
          python -m pytest \
            tests/test_phase18_production_security.py \
            tests/test_phase18_secret_scan_contract.py \
            -q


      # ------------------------------------------------------------
      # Docker Compose validation
      # ------------------------------------------------------------

      - name: Validate Docker Compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.phase13.yml \
            config > /dev/null


      # ------------------------------------------------------------
      # Node / Frontend
      # ------------------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json


      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm install


      # ------------------------------------------------------------
      # Frontend dependency audit
      # ------------------------------------------------------------

      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm audit --audit-level=high


      # ------------------------------------------------------------
      # Frontend production build
      # ------------------------------------------------------------

      - name: Frontend production build
        working-directory: frontend
        run: |
          npm run build