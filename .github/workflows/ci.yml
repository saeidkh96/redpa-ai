name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

      APP_NAME: "RedPA AI"
      APP_ENV: "test"
      DEBUG: "false"

      API_V1_PREFIX: "/api/v1"

      SECRET_KEY: "github-actions-test-secret-key-that-is-long-enough-for-testing"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/redpa_ai_test"

      OLLAMA_BASE_URL: "http://localhost:11434"
      OLLAMA_MODEL: "qwen2.5:7b"

      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Show Python version
        run: |
          python --version
          pip --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio httpx

      - name: Compile backend source
        run: |
          python -m compileall -q app

      - name: Verify application imports
        run: |
          python -c "from app.main import app; print('FastAPI application imported successfully')"

      - name: Run tests
        shell: bash
        run: |
          if find tests -type f -name "test_*.py" 2>/dev/null | grep -q .; then
            python -m pytest tests -v
          else
            echo "No tests were found."
            echo "Backend installation, compilation, and import checks passed."
          fi