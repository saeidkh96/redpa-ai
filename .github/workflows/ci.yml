name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redpa_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d redpa_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: RedPA AI
      APP_ENV: test
      DEBUG: "false"
      API_V1_PREFIX: /api/v1

      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/redpa_ai_test

      SECRET_KEY: github-actions-test-secret-key-that-is-long-enough
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: qwen2.5:7b

      CORS_ORIGINS: http://localhost:3000,http://localhost:5173

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python source
        run: python -m compileall -q app

      - name: Check Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: |
          if [ -d tests ] && find tests -type f -name "test_*.py" | grep -q .; then
            python -m pytest -q
          else
            echo "No pytest test files found; skipping test execution."
          fi