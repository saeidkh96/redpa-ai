name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

      APP_NAME: "RedPA AI"
      APP_VERSION: "19.7.0"
      APP_ENV: "test"
      ENVIRONMENT: "development"
      DEBUG: "false"
      LOG_LEVEL: "INFO"
      JSON_LOGS: "true"
      EXPOSE_ERROR_DETAILS: "true"

      API_V1_PREFIX: "/api/v1"

      JWT_SECRET_KEY: "github-actions-test-jwt-secret-key-that-is-long-enough"
      SECRET_KEY: "github-actions-test-secret-key-that-is-at-least-32-characters"
      API_KEY_PEPPER: "github-actions-test-api-key-pepper"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"

      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/redpa_ai_test"
      REDIS_URL: "redis://localhost:6379/0"
      QDRANT_URL: "http://localhost:6333"

      OLLAMA_BASE_URL: "http://localhost:11434"
      OLLAMA_MODEL: "qwen2.5:7b"

      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      REQUIRE_HTTPS: "false"

      OTEL_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://localhost:4318"

      RATE_LIMIT_REQUESTS: "120"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      IDEMPOTENCY_TTL_SECONDS: "86400"

      SLOW_REQUEST_THRESHOLD_MS: "1000"
      SLOW_QUERY_THRESHOLD_MS: "500"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Show repository structure
        shell: bash
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Show Python version
        run: |
          python --version
          python -m pip --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install backend dependencies
        shell: bash
        run: |
          if [ -f "requirements.txt" ]; then
            echo "Installing dependencies from root requirements.txt"
            python -m pip install -r requirements.txt

          elif [ -f "backend/requirements.txt" ]; then
            echo "Installing dependencies from backend/requirements.txt"
            python -m pip install -r backend/requirements.txt

          elif [ -f "pyproject.toml" ]; then
            echo "Installing project from root pyproject.toml"
            python -m pip install .

          elif [ -f "backend/pyproject.toml" ]; then
            echo "Installing project from backend/pyproject.toml"
            python -m pip install ./backend

          else
            echo "ERROR: No requirements.txt or pyproject.toml was found."
            exit 1
          fi

      - name: Install CI test dependencies
        run: |
          python -m pip install pytest pytest-asyncio httpx

      - name: Install RedPA Python SDK
        run: |
          python -m pip install -e ./sdk/python

      - name: Compile Python source
        shell: bash
        run: |
          if [ -d "backend/app" ]; then
            echo "Compiling backend/app"
            python -m compileall -q backend/app

          elif [ -d "app" ]; then
            echo "Compiling app"
            python -m compileall -q app

          else
            echo "ERROR: Neither backend/app nor app directory was found."
            exit 1
          fi

      - name: Verify FastAPI application import
        shell: bash
        run: |
          if [ -f "backend/app/main.py" ]; then
            echo "Importing application from backend/app/main.py"
            cd backend
            python -c "from app.main import app; print('FastAPI application imported successfully:', app.title)"

          elif [ -f "app/main.py" ]; then
            echo "Importing application from app/main.py"
            python -c "from app.main import app; print('FastAPI application imported successfully:', app.title)"

          else
            echo "ERROR: app/main.py was not found."
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          if [ -d "backend/tests" ] && find backend/tests -type f -name "test_*.py" | grep -q .; then
            echo "Running tests from backend/tests"
            cd backend
            python -m pytest tests -v

          elif [ -d "tests" ] && find tests -type f -name "test_*.py" | grep -q .; then
            echo "Running tests from tests"
            python -m pytest tests -v

          else
            echo "No pytest test files were found."
            echo "Dependency installation, compilation, and application import passed."
          fi

      - name: Create CI .env
        shell: bash
        run: |
            cat > .env << EOF
            APP_NAME=RedPA AI
            APP_VERSION=19.7.0
            ENVIRONMENT=development
            DEBUG=false
            API_V1_PREFIX=/api/v1

            DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/redpa_ai_test
            REDIS_URL=redis://localhost:6379/0
            QDRANT_URL=http://localhost:6333

            JWT_SECRET_KEY=github-actions-test-jwt-secret-key
            SECRET_KEY=github-actions-secret-key
            ACCESS_TOKEN_EXPIRE_MINUTES=60
            EOF



      - name: Validate Docker Compose
        shell: bash
        run: |
          docker compose config
