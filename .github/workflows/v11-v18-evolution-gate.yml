name: V11-V18 Evolution Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evolution-contract:
    runs-on: ubuntu-latest

    env:
      APP_NAME: RedPA AI
      APP_VERSION: "18.2.0"
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/redpa_ai
      JWT_SECRET_KEY: ci-only-secret-key-for-tests
      OTEL_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio httpx

      - name: Install RedPA Python SDK
        run: |
          python -m pip install -e ./sdk/python

      - name: V11-V18 feature contracts
        run: python -m pytest tests/test_v11_v18_feature_pack.py -q

      - name: Regression suite
        run: python -m pytest tests -q

      - name: Secret scan
        run: python scripts/security/secret_scan.py