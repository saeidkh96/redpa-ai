name: Release Validation

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"


permissions:
  contents: read


jobs:
  release:
    name: Validate Release

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/redpa_ai_test"
      JWT_SECRET_KEY: "github-actions-test-jwt-secret-key-that-is-long-enough"
    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel


      # ------------------------------------------------------------
      # Backend dependencies
      # ------------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt


      # ------------------------------------------------------------
      # Test dependencies
      # ------------------------------------------------------------

      - name: Install test dependencies
        run: |
          python -m pip install pytest pytest-asyncio httpx


      # ------------------------------------------------------------
      # RedPA Python SDK
      # ------------------------------------------------------------

      - name: Install RedPA Python SDK
        run: |
          python -m pip install -e ./sdk/python

      - name: Verify RedPA SDK import
        run: |
          python -c "import redpa_sdk; print('RedPA SDK version:', redpa_sdk.__version__)"


      # ------------------------------------------------------------
      # Compile
      # ------------------------------------------------------------

      - name: Compile
        run: |
          python -m compileall -q backend/app


      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------

      - name: Test
        run: |
          python -m pytest tests -q


      # ------------------------------------------------------------
      # Docker Compose
      # ------------------------------------------------------------

      - name: Validate Compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.phase13.yml \
            config > /dev/null


      # ------------------------------------------------------------
      # Release files
      # ------------------------------------------------------------

      - name: Verify release files
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md

          echo "Release validation completed."