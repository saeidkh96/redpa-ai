name: V9 Production Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: "9.0.0"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/redpa_ai_test
      JWT_SECRET_KEY: github-actions-v9-test-secret-key-that-is-long-enough
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e ./sdk/python
          python -m pip install pytest pytest-asyncio httpx pyyaml
      - name: Verify SDK
        run: python -c "import redpa_sdk; print(redpa_sdk.__version__)"
      - name: Compile V9 source
        run: python -m compileall -q backend/app scripts/operations scripts/reliability
      - name: Run regression suite
        run: python -m pytest tests -q
      - name: Validate Compose
        run: docker compose config
      - name: Secret scan
        run: python scripts/security/secret_scan.py
