name: V3 Release Gate

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v3.*"

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:
  release-gate:
    name: RedPA v3 Release Gate

    runs-on: ubuntu-latest

    timeout-minutes: 30
    env:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/redpa_ai_test"
      JWT_SECRET_KEY: "github-actions-test-jwt-secret-key-that-is-long-enough"
    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel


      # ------------------------------------------------------------
      # Runtime dependencies
      # ------------------------------------------------------------

      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements.txt


      # ------------------------------------------------------------
      # Test dependencies
      # ------------------------------------------------------------

      - name: Install test dependencies
        run: |
          python -m pip install pytest pytest-asyncio httpx


      # ------------------------------------------------------------
      # Compile
      # ------------------------------------------------------------

      - name: Compile backend
        run: |
          python -m compileall -q backend/app


      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------

      - name: Run backend test suite
        run: |
          python -m pytest tests -q


      # ------------------------------------------------------------
      # Docker Compose
      # ------------------------------------------------------------

      - name: Validate Docker Compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.phase13.yml \
            config > /dev/null


      # ------------------------------------------------------------
      # Release manifest
      # ------------------------------------------------------------

      - name: Verify v3 release manifest
        run: |
          test -f RELEASE_MANIFEST_v3.0.0.json
          test -f docs/release/V3_RELEASE_NOTES.md
          test -f docs/release/V3_FINAL_CHECKLIST.md


      # ------------------------------------------------------------
      # Build release archive
      # ------------------------------------------------------------

      - name: Build v3 release archive
        run: |
          python scripts/release/build_v3_archive.py


      # ------------------------------------------------------------
      # Verify archive
      # ------------------------------------------------------------

      - name: Verify release archive
        run: |
          test -f dist/redpa-ai-v3.0.0.zip
          test -f dist/redpa-ai-v3.0.0.sha256

          echo "Release archive:"
          ls -lh dist/redpa-ai-v3.0.0.zip

          echo ""
          echo "SHA256:"
          cat dist/redpa-ai-v3.0.0.sha256


      # ------------------------------------------------------------
      # Upload CI artifact
      # ------------------------------------------------------------

      - name: Upload v3 release artifact
        uses: actions/upload-artifact@v4
        with:
          name: redpa-ai-v3.0.0
          path: |
            dist/redpa-ai-v3.0.0.zip
            dist/redpa-ai-v3.0.0.sha256
          if-no-files-found: error
          retention-days: 14