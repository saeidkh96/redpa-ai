name: V10.3 Governance E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/app/governance_v10/**"
      - "backend/app/ops_v9/**"
      - "backend/app/services/policy_*"
      - "backend/app/models/policy_override_v10.py"
      - "backend/alembic/versions/v102a1b2c3d4e_policy_overrides.py"
      - "policy-service/**"
      - "docker-compose.yml"
      - "scripts/e2e/v10_governance_ops_e2e.py"

jobs:
  governed-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JWT_SECRET_KEY: github-actions-v10-e2e-secret-key-long-enough
      APP_VERSION: "19.1.0"
      OTEL_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install E2E client
        run: python -m pip install "httpx>=0.28,<1"

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Start V10 stack
        run: docker compose up -d --build

      - name: Apply migrations
        run: docker compose exec -T backend python -m alembic -c alembic.ini upgrade head

      - name: Run governed recovery E2E
        run: python scripts/e2e/v10_governance_ops_e2e.py

      - name: Collect diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs backend ops-agent policy-service --tail 200 > v10-e2e-logs.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-governance-e2e-logs
          path: v10-e2e-logs.txt

      - name: Stop stack
        if: always()
        run: docker compose down -v
