services:

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: redpa-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
    networks:
      - redpa-network

  tempo:
    image: grafana/tempo:latest
    container_name: redpa-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - redpa-tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - redpa-network


  redis:
    image: redis:7-alpine
    container_name: redpa-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redpa-redis-data:/data"]
    networks: ["redpa-network"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  background-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-background-worker
    command: ["python", "-m", "app.background_jobs.worker"]
    working_dir: /app/backend
    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/redpa_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: ["redpa-network"]

  background-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-background-scheduler
    command: ["python", "-m", "app.background_jobs.scheduler"]
    working_dir: /app/backend
    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/redpa_ai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: ["redpa-network"]


  outbox-publisher:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-outbox-publisher
    restart: unless-stopped
    command: ["python", "-m", "app.events.outbox_publisher"]
    working_dir: /app/backend
    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/redpa_ai}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-CHANGE_THIS_TO_A_LONG_RANDOM_SECRET}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EVENT_STREAM_NAME: ${EVENT_STREAM_NAME:-redpa:events}
      OUTBOX_PUBLISHER_POLL_SECONDS: ${OUTBOX_PUBLISHER_POLL_SECONDS:-1}
      OUTBOX_PUBLISHER_BATCH_SIZE: ${OUTBOX_PUBLISHER_BATCH_SIZE:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: ["redpa-network"]


  postgres-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-postgres-agent
    command: ["python", "-m", "app.specialist_agents.postgres_agent"]
    working_dir: /app/backend
    environment:
      PYTHONPATH: /app/backend
      POSTGRES_AGENT_HOST: 0.0.0.0
      POSTGRES_AGENT_PORT: 8062
      POSTGRES_AGENT_PUBLIC_URL: http://postgres-agent:8062
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/redpa_ai
    ports:
      - "8062:8062"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - redpa-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8062/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  docker-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-docker-agent
    command: ["python", "-m", "app.specialist_agents.docker_agent"]
    working_dir: /app/backend
    environment:
      PYTHONPATH: /app/backend
      DOCKER_AGENT_HOST: 0.0.0.0
      DOCKER_AGENT_PORT: 8063
      DOCKER_AGENT_PUBLIC_URL: http://docker-agent:8063
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8063:8063"
    networks:
      - redpa-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8063/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  filesystem-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-filesystem-agent
    command: ["python", "-m", "app.specialist_agents.filesystem_agent"]
    working_dir: /app/backend
    environment:
      PYTHONPATH: /app/backend
      FILESYSTEM_AGENT_HOST: 0.0.0.0
      FILESYSTEM_AGENT_PORT: 8064
      FILESYSTEM_AGENT_PUBLIC_URL: http://filesystem-agent:8064
      FILESYSTEM_AGENT_ROOT: /app
    ports:
      - "8064:8064"
    networks:
      - redpa-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8064/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  github-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-github-agent
    command: ["python", "-m", "app.specialist_agents.github_agent"]
    working_dir: /app/backend
    environment:
      PYTHONPATH: /app/backend
      GITHUB_AGENT_HOST: 0.0.0.0
      GITHUB_AGENT_PORT: 8065
      GITHUB_AGENT_PUBLIC_URL: http://github-agent:8065
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8065:8065"
    networks:
      - redpa-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8065/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  research-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-research-agent
    command:
      - python
      - -m
      - app.research_agent.server
    working_dir: /app/backend
    environment:
      RESEARCH_AGENT_HOST: 0.0.0.0
      RESEARCH_AGENT_PORT: 8061
      RESEARCH_AGENT_PUBLIC_URL: http://research-agent:8061
      PYTHONPATH: /app/backend
    ports:
      - "8061:8061"
    networks:
      - redpa-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
              'http://localhost:8061/health',
              timeout=5
          )
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    container_name: redpa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-redpa_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - redpa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-redpa_ai}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - redpa-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: redpa-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - redpa-qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 5 bash -c '</dev/tcp/127.0.0.1/6333'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - redpa-network

  filesystem-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-filesystem-mcp
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "app.mcp_servers.filesystem_server",
      ]
    environment:
      FILESYSTEM_MCP_HOST: 0.0.0.0
      FILESYSTEM_MCP_PORT: 8010
      FILESYSTEM_MCP_ROOT: /workspace
    ports:
      - "8010:8010"
    volumes:
      - ./backend:/workspace/backend:ro
      - ./docs:/workspace/docs:ro
      - ./README.md:/workspace/README.md:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8010),3); s.close()",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - redpa-network


  github-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-github-mcp
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "app.mcp_servers.github_server",
      ]
    environment:
      GITHUB_MCP_HOST: 0.0.0.0
      GITHUB_MCP_PORT: 8020
      GITHUB_MCP_TIMEOUT_SECONDS: 20
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "8020:8020"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8020),3); s.close()",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - redpa-network


  postgres-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-postgres-mcp
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "app.mcp_servers.postgres_server",
      ]
    environment:
      POSTGRES_MCP_HOST: 0.0.0.0
      POSTGRES_MCP_PORT: 8030
      POSTGRES_MCP_STATEMENT_TIMEOUT_MS: 5000
      POSTGRES_MCP_MAX_ROWS: 200
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/redpa_ai}
    ports:
      - "8030:8030"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8030),3); s.close()",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - redpa-network


  docker-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-docker-mcp
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "app.mcp_servers.docker_server",
      ]
    environment:
      DOCKER_MCP_HOST: 0.0.0.0
      DOCKER_MCP_PORT: 8040
      DOCKER_MCP_TIMEOUT_SECONDS: 15
      DOCKER_SOCKET_PATH: /var/run/docker.sock
    ports:
      - "8040:8040"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8040),3); s.close()",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - redpa-network


  a2a-coordinator:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-a2a-coordinator
    restart: unless-stopped
    command:
      [
        "python",
        "-m",
        "app.a2a_protocol.server",
      ]
    environment:
      A2A_HOST: 0.0.0.0
      A2A_PORT: 8050
      A2A_PUBLIC_URL: http://a2a-coordinator:8050
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/redpa_ai}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - redpa-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: redpa-ai-backend
    container_name: redpa-backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-RedPA AI}
      APP_VERSION: "7.0.0"
      ENVIRONMENT: development
      DEBUG: ${DEBUG:-true}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3001","http://127.0.0.1:3001","http://localhost:5173","http://127.0.0.1:5173"]'
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/redpa_ai}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-redpa_documents}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.2}
      MODEL_GATEWAY_OPENAI_ENABLED: ${MODEL_GATEWAY_OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      MODEL_GATEWAY_ANTHROPIC_ENABLED: ${MODEL_GATEWAY_ANTHROPIC_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      MODEL_GATEWAY_GEMINI_ENABLED: ${MODEL_GATEWAY_GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      MODEL_GATEWAY_FALLBACK_PROVIDERS: ${MODEL_GATEWAY_FALLBACK_PROVIDERS:-}
      MODEL_GATEWAY_ECONOMICS_JSON: ${MODEL_GATEWAY_ECONOMICS_JSON:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      STORAGE_DIRECTORY: ${STORAGE_DIRECTORY:-/app/backend/storage}
      MCP_SERVERS_CONFIG_PATH: ${MCP_SERVERS_CONFIG_PATH:-config/mcp_servers.json}
      REDIS_URL: redis://redis:6379/0
      REQUIRE_HTTPS: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      filesystem-mcp:
        condition: service_healthy
      github-mcp:
        condition: service_healthy
      postgres-mcp:
        condition: service_healthy
      docker-mcp:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - redpa-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: redpa-ai-frontend
    container_name: redpa-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_REDPA_API_URL: ${NEXT_PUBLIC_REDPA_API_URL:-http://localhost:8000}
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_started
    networks:
      - redpa-network
  
  prometheus:
    image: prom/prometheus:latest
    container_name: redpa-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - redpa-prometheus-data:/prometheus
    depends_on:
      - backend
    networks:
      - redpa-network

  grafana:
    image: grafana/grafana:latest
    container_name: redpa-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - redpa-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - redpa-network

volumes:
  redpa-tempo-data:
  redpa-redis-data:
  redpa-postgres-data:
  redpa-qdrant-data:
  redpa-prometheus-data:
  redpa-grafana-data:

networks:
  redpa-network:
    name: redpa-network
    driver: bridge