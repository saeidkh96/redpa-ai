apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redpa-default-deny
  namespace: redpa
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redpa-backend-allow
  namespace: redpa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 443
